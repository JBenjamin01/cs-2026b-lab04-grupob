# Tarea A (Lab 09): criterios de aceptación en Gherkin para las historias de San Camilo en Línea.
# Ejecutar desde esta carpeta:  npx promptfoo@0.118.0 eval --no-cache -o resultados.json
description: "San Camilo en Línea: criterios de aceptación (Gherkin en JSON) a partir de historias de usuario"

prompts:
  - file://v1.txt
  - file://v2.txt
  - file://v3.txt

providers:
  - id: file://../proveedor_grabado.py
    label: asistente-grabado
    config: {grabaciones: criterios/grabaciones}
  # Con clave de API (en una variable de entorno, nunca en el repositorio):
  # - id: anthropic:messages:claude-sonnet-4-5
  #   config: {temperature: 0}

defaultTest:
  assert:
    - type: is-json                       # A1: JSON válido que cumple el contrato
      value: file://esquema.json
      metric: A1_contrato_json
    - type: javascript                    # A2: al menos un escenario de éxito y uno de error o borde
      metric: A2_exito_y_error
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
        if (o.invest_ok === false) return true;
        const t = (o.escenarios || []).map(e => e.tipo);
        return t.includes('exito') && (t.includes('error') || t.includes('borde'));
    - type: javascript                    # A3: los ESCENARIOS describen comportamiento, no implementación
      metric: A3_sin_implementacion
      value: |
        const prohibidas = ['postgresql', 'django', 'redis', 'celery', 'endpoint', 'tabla', 'base de datos',
                            'webhook', 'api de', 'api rest', 'indexeddb', 'service worker', 'http'];
        let texto = output.toLowerCase();             // si no es JSON, se revisa toda la respuesta
        try { texto = JSON.stringify(JSON.parse(output).escenarios || []).toLowerCase(); } catch (e) {}
        return !prohibidas.some(p => texto.includes(p));
    - type: javascript                    # A6: la respuesta corresponde a la historia pedida
      metric: A6_id_correcto
      value: |
        let o; try { o = JSON.parse(output); } catch (e) { return false; }
        return o.historia_id === context.vars.id;

tests: file://casos.yaml
